# 策略1：最小流通市值策略
# 描述：筛选流通市值较小的股票，同时确保基本面和流动性指标健康

# 策略名称
strategy_name: "最小流通市值策略"

# 筛选条件
filters:
  # 排除ST股票
  - field: "exclude_st"
    operator: "eq"
    value: true

  # 股价 >= 1元
  - field: "close"
    operator: "gte"
    value: 1

  # 股价振幅 > 0.5%
  - field: "price_amplitude"
    operator: "gt"
    value: 0.005

  # 未来20日新增流通股占比 < 10%
  - field: "future_20day_new_share_ratio"
    operator: "lt"
    value: 0.10

  # 每股净资产 > 0
  - field: "net_assets_per_share"
    operator: "gt"
    value: 0

# 排名规则
ranking:
  # 按流通市值从小到大排名
  - field: "circulation_market_cap"
    order: "asc"  # asc-升序, desc-降序
    weight: 1.0
